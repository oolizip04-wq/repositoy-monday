<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>링크 이동</title>
  <style>
    body { font-family: sans-serif; margin: 0; padding: 16px; }
    ul { list-style: none; padding: 0; max-width: 480px; margin: 0 auto; }
    li { margin: 12px 0; }
    a {
      display: block;
      padding: 16px;
      text-align: center;
      font-size: 18px;
      color: #fff;
      background: #4285f4;
      border-radius: 8px;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <ul>
    <li><a href="https://www.naver.com">네이버</a></li>
    <li><a href="https://www.daum.net">다음</a></li>
    <li><a href="https://www.google.com">구글</a></li>
    <li><a href="https://www.youtube.com">유튜브</a></li>
  </ul>

  <script>
    // 모바일에서는 링크를 Chrome 앱으로 바로 열도록 바꾼다. (PC는 그대로 사용)
    var ua = navigator.userAgent;
    var isAndroid = /Android/i.test(ua);
    var isIOS = /iPhone|iPad|iPod/i.test(ua);

    document.querySelectorAll('a').forEach(function (a) {
      var url = new URL(a.href);
      if (isAndroid) {
        a.href = 'intent://' + url.host + url.pathname + url.search +
                 '#Intent;scheme=https;package=com.android.chrome;end';
      } else if (isIOS) {
        a.href = 'googlechromes://' + url.host + url.pathname + url.search;
      }
    });
  </script>
</body>
</html>
